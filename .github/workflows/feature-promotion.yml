name: Feature Promotion

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: develop-reintegration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  lint:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'feature/')
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'feature/')
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --runInBand

  format-check:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'feature/')
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check

  deploy:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'feature/')
    needs:
      - lint
      - test
      - format-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_API_BASE_URL: ${{ secrets.DEVELOPMENT_API_BASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error title=Missing secret::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ -z "${VERCEL_ORG_ID}" ]; then
            echo "::error title=Missing secret::VERCEL_ORG_ID is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error title=Missing secret::VERCEL_PROJECT_ID is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ -z "${DEPLOY_API_BASE_URL}" ]; then
            echo "::error title=Missing secret::DEVELOPMENT_API_BASE_URL is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Remove previous Vercel link
        run: rm -rf .vercel

      - name: Diagnose Vercel access
        shell: bash
        run: |
          set -euo pipefail

          if ! vercel project ls --token="${{ secrets.VERCEL_TOKEN }}" >/dev/null 2>&1; then
            echo "::error title=Vercel access failed::The VERCEL_TOKEN is invalid or does not have access to the expected Vercel scope."
            exit 1
          fi

          if ! vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}" >/tmp/vercel-pull.log 2>&1; then
            cat /tmp/vercel-pull.log
            echo "::error title=Vercel project link failed::Could not load the project using VERCEL_ORG_ID and VERCEL_PROJECT_ID. Check that both IDs belong to the same Vercel team/project accessible by VERCEL_TOKEN."
            exit 1
          fi

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Sync preview build environment for feature
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "API_BASE_URL=${DEPLOY_API_BASE_URL}" \
            "DEVELOPMENT_API_BASE_URL=${DEPLOY_API_BASE_URL}" \
            > .vercel/.env.preview.local

      - name: Build Vercel project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
