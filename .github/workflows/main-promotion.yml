name: Main Promotion

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: main-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: npm run build:prod

  test-coverage:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage tests
        run: npm run test:coverage -- --watch=false --runInBand

  deploy:
    needs:
      - test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error title=Missing secret::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ -z "${VERCEL_ORG_ID}" ]; then
            echo "::error title=Missing secret::VERCEL_ORG_ID is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error title=Missing secret::VERCEL_PROJECT_ID is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ -z "${DEPLOY_API_BASE_URL}" ]; then
            echo "::error title=Missing secret::API_BASE_URL is not configured in GitHub Actions secrets."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Remove previous Vercel link
        run: rm -rf .vercel

      - name: Diagnose Vercel access
        shell: bash
        run: |
          set -euo pipefail

          if ! vercel project ls --token="${{ secrets.VERCEL_TOKEN }}" >/dev/null 2>&1; then
            echo "::error title=Vercel access failed::The VERCEL_TOKEN is invalid or does not have access to the expected Vercel scope."
            exit 1
          fi

          if ! vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" >/tmp/vercel-pull.log 2>&1; then
            cat /tmp/vercel-pull.log
            echo "::error title=Vercel production access failed::Could not load the production environment using VERCEL_ORG_ID and VERCEL_PROJECT_ID. Check project access and confirm the production environment is available for this Vercel project."
            exit 1
          fi

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Sync production build environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "API_BASE_URL=${DEPLOY_API_BASE_URL}" \
            > .vercel/.env.production.local

      - name: Build Vercel production project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
