<main class="login-page">
  <div class="login-page__glow login-page__glow--top"></div>
  <div class="login-page__glow login-page__glow--left"></div>
  <div class="login-page__glow login-page__glow--bottom"></div>

  <header class="login-page__header">
    <app-language-switcher
      [label]="translation().languageSelectorLabel"
      [selectedLanguage]="selectedLanguage()"
      (languageChange)="changeLanguage($event)"
    />
  </header>

  <section class="login-page__content">
    <article class="login-card">
      <div class="login-card__brand" aria-hidden="true">
        <img class="login-card__brand-image" src="/app-icon.svg" alt="" />
      </div>

      <h1 class="login-card__title">{{ translation().title }}</h1>
      <p class="login-card__subtitle">{{ translation().subtitle }}</p>

      @if (apiError()) {
        <div class="login-card__api-error" role="alert">
          {{ apiError() }}
        </div>
      }

      <form class="login-card__form" [formGroup]="loginForm" (ngSubmit)="submit()">
        <aq-text-formfield
          formControlName="email"
          [label]="translation().emailLabel"
          [placeholder]="translation().emailPlaceholder"
          type="email"
          autocomplete="email"
          [errorMessages]="emailErrorMessages()"
        />

        <aq-text-formfield
          formControlName="password"
          [label]="translation().passwordLabel"
          [placeholder]="translation().passwordPlaceholder"
          type="password"
          autocomplete="current-password"
          [passwordToggle]="true"
          [errorMessages]="passwordErrorMessages()"
        />

        <a class="login-card__forgot-password" routerLink="/forgot-password">
          {{ translation().forgotPassword }}
        </a>

        <button type="submit" class="login-card__submit-button" [disabled]="isLoading()">
          {{ isLoading() ? translation().loadingLabel : translation().submitLabel }}
        </button>
      </form>

      <div class="login-card__divider">
        <span class="login-card__divider-text">{{ translation().createAccountPrompt }}</span>
      </div>

      <a class="login-card__registration-link" routerLink="/registration">
        {{ translation().createAccount }}
        <span aria-hidden="true">&rarr;</span>
      </a>
    </article>
  </section>

  <footer class="login-page__footer">
    {{ currentYear }} AquaTrack. {{ translation().footer }}
  </footer>
</main>
