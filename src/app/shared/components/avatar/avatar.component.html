<div
  [class]="avatarClass()"
  role="img"
  [attr.aria-label]="alt() || truncatedInitials() || 'avatar'"
>
  @switch (variant()) {
    @case ('circular') {
      <img class="avatar__image" [src]="src()" [alt]="alt()" />
    }
    @case ('initials') {
      <span class="avatar__initials" aria-hidden="true">{{ truncatedInitials() }}</span>
    }
    @case ('icon') {
      <span class="material-icons avatar__icon" aria-hidden="true">{{ icon() }}</span>
    }
  }
</div>
