<nav class="nav-menu" [class.nav-menu--collapsed]="collapsed()">
  <a class="nav-menu__brand" routerLink="/" [attr.aria-label]="homeAriaLabel()">
    <span class="material-icons nav-menu__brand-icon">waves</span>
    @if (!collapsed()) {
      <span class="nav-menu__brand-name">AquaTrack</span>
    }
  </a>

  <ul class="nav-menu__list">
    @for (item of visibleItems(); track item.id) {
      <li class="nav-menu__item">
        <a
          class="nav-menu__link"
          [routerLink]="item.route"
          routerLinkActive="nav-menu__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [title]="collapsed() ? item.label : ''"
        >
          <span class="material-icons nav-menu__link-icon">{{ item.icon }}</span>
          @if (!collapsed()) {
            <span class="nav-menu__link-label">{{ item.label }}</span>
          }
        </a>
      </li>
    }
  </ul>

  <div class="nav-menu__footer">
    <button
      type="button"
      class="nav-menu__toggle"
      (click)="toggleCollapse()"
      [attr.aria-label]="collapsed() ? expandLabel() : collapseLabel()"
    >
      <span class="material-icons">{{ collapsed() ? 'chevron_right' : 'chevron_left' }}</span>
      @if (!collapsed()) {
        <span class="nav-menu__toggle-label">{{ collapseLabel() }}</span>
      }
    </button>
  </div>
</nav>
