<div class="paginator__size">
  <aq-select-formfield
    class="paginator__size-field"
    [formControl]="pageSizeControl"
    label="Itens por pagina"
    placeholder="Selecionar"
    [options]="pageSizeSelectOptions()"
    (selectionChange)="onSizeChange($event)"
  />
</div>

<div class="paginator__nav">
  <span class="paginator__info" aria-live="polite">
    {{ pageStart() }}-{{ pageEnd() }} de {{ totalItems() }}
  </span>

  <div class="paginator__controls">
    <button
      class="paginator__button"
      type="button"
      aria-label="Pagina anterior"
      [disabled]="!hasPreviousPage()"
      (click)="onPrevious()"
    >
      <span class="material-icons-outlined">chevron_left</span>
    </button>

    <button
      class="paginator__button"
      type="button"
      aria-label="Proxima pagina"
      [disabled]="!hasNextPage()"
      (click)="onNext()"
    >
      <span class="material-icons-outlined">chevron_right</span>
    </button>
  </div>
</div>
