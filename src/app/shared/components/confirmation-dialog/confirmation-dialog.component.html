<div
  class="confirmation-dialog__surface"
  [class.confirmation-dialog__surface--danger]="data.tone === 'danger'"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="confirmation-dialog-title"
  aria-describedby="confirmation-dialog-message"
>
  <h2 id="confirmation-dialog-title" class="confirmation-dialog__title">{{ data.title }}</h2>
  <p id="confirmation-dialog-message" class="confirmation-dialog__message">{{ data.message }}</p>

  @if (data.confirmWord) {
    <div class="confirmation-dialog__field">
      <label class="confirmation-dialog__field-label" for="confirmation-dialog-confirm-word">
        {{ data.confirmWordLabel }}
      </label>
      <aq-text-formfield
        id="confirmation-dialog-confirm-word"
        type="text"
        [formControl]="confirmControl"
        autocomplete="off"
        [hideErrorMessage]="true"
      ></aq-text-formfield>
    </div>
  }

  <div class="confirmation-dialog__actions">
    <button aqButton type="button" variant="stroked" color="tertiary" (click)="cancel()">
      {{ data.cancelLabel }}
    </button>
    <button
      aqButton
      type="button"
      [color]="data.tone === 'danger' ? 'error' : 'primary'"
      [disabled]="isConfirmDisabled()"
      (click)="confirm()"
    >
      {{ data.confirmLabel }}
    </button>
  </div>
</div>
