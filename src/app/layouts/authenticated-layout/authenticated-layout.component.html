<div class="layout">
  <aside class="layout__sidebar">
    <app-nav-menu
      [items]="navItems()"
      [userRoles]="userRoles()"
      [userPlan]="userPlan()"
      [collapseLabel]="languageService.translation().navCollapse"
      [expandLabel]="languageService.translation().navExpand"
      [homeAriaLabel]="languageService.translation().navGoHome"
    />
  </aside>

  <div class="layout__content">
    <app-toolbar
      [showBrand]="false"
      [pageTitle]="pageTitleService.title()"
      [pageSubtitle]="pageTitleService.subtitle()"
      [userName]="userName()"
      [userEmail]="userEmail()"
      [userInitials]="userInitials()"
      [userAvatarUrl]="userAvatarUrl()"
      [userPlan]="userPlan()"
      [selectedLanguage]="selectedLanguage()"
      [languageSelectorLabel]="languageService.translation().languageSelectorLabel"
      [userMenuItems]="userMenuItems()"
      (languageChange)="onLanguageChange($event)"
      (userMenuItemClick)="onUserMenuItemClick($event)"
    />

    <main class="layout__main" role="main">
      <router-outlet />
    </main>
  </div>
</div>
